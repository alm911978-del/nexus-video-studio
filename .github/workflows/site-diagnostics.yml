name: NEXUS Site Diagnostics Tests

on:
  push:
    branches:
      - "nexus/**"
    paths:
      - "index.html"
      - "hybrid.html"
      - "tests/hybrid-router.test.mjs"
      - "i18n.js"
      - "tests/site-diagnostics.test.mjs"
      - ".github/workflows/site-diagnostics.yml"
  pull_request:
    branches:
      - main
    paths:
      - "index.html"
      - "hybrid.html"
      - "tests/hybrid-router.test.mjs"
      - "i18n.js"
      - "tests/site-diagnostics.test.mjs"
      - ".github/workflows/site-diagnostics.yml"

permissions:
  contents: read

jobs:
  site-smoke-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Run static site diagnostics tests
        run: node --test tests/site-diagnostics.test.mjs tests/hybrid-router.test.mjs

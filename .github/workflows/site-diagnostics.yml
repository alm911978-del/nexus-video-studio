name: NEXUS Site Diagnostics Tests

on:
  push:
    branches:
      - "nexus/**"
    paths:
      - "index.html"
      - "i18n.js"
      - "tests/site-diagnostics.test.mjs"
      - ".github/workflows/site-diagnostics.yml"
  pull_request:
    branches:
      - main
    paths:
      - "index.html"
      - "i18n.js"
      - "tests/site-diagnostics.test.mjs"
      - ".github/workflows/site-diagnostics.yml"

permissions:
  contents: read

jobs:
  site-smoke-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Run static site diagnostics tests
        run: node --test tests/site-diagnostics.test.mjs

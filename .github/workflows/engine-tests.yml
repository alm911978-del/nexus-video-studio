name: NEXUS Engine Validation Tests

on:
  push:
    branches:
      - "feature/nexus-video-engine-v1"
      - "nexus/engine-multipart-cve-fix-20261107"
    paths:
      - "engine/**"
      - ".github/workflows/engine-tests.yml"
  pull_request:
    branches:
      - main
    paths:
      - "engine/**"
      - ".github/workflows/engine-tests.yml"

permissions:
  contents: read

jobs:
  engine-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: engine/requirements.txt
      - name: Install engine dependencies
        run: python -m pip install -r requirements.txt
        working-directory: engine
      - name: Run all engine tests
        run: python -m pytest -q
        working-directory: engine

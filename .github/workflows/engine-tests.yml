name: NEXUS Engine Validation Tests

on:
  push:
    branches:
      - "feature/nexus-video-engine-v1"
    paths:
      - "engine/**"
      - ".github/workflows/engine-tests.yml"
  pull_request:
    branches:
      - main
    paths:
      - "engine/**"
      - ".github/workflows/engine-tests.yml"

permissions:
  contents: read

jobs:
  engine-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: engine/requirements.txt
      - name: Install engine dependencies
        run: python -m pip install -r requirements.txt
        working-directory: engine
      - name: Run engine validation tests
        run: python -m pytest -q test_app_validation.py
        working-directory: engine

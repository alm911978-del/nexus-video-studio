name: NEXUS static smoke checks

on:
  push:
    branches: [main, nexus-5.0-pages-readiness]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Run static smoke tests
        run: node --test test/site-smoke.test.mjs
      - name: Run gateway unit tests
        working-directory: worker
        run: npm test

name: NEXUS static smoke checks

on:
  push:
    branches: [main, nexus-5.0-pages-readiness]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Run static smoke tests
        run: node --test test/site-smoke.test.mjs
      - name: Run gateway unit tests
        working-directory: worker
        run: npm test

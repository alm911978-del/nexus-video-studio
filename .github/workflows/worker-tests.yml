name: NEXUS Worker Tests

on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - "index.html"
      - "i18n.js"
      - ".github/workflows/worker-tests.yml"
  pull_request:
    paths:
      - "worker/**"
      - "index.html"
      - "i18n.js"
      - ".github/workflows/worker-tests.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node.js
        uses: actions/setup-node@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          node-version: "22"
      - name: Run gateway and static-site tests
        working-directory: worker
        run: npm test

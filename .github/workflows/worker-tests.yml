name: NEXUS Worker Tests

on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - "index.html"
      - ".github/workflows/worker-tests.yml"
  pull_request:
    paths:
      - "worker/**"
      - "index.html"
      - ".github/workflows/worker-tests.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run gateway and static-site tests
        working-directory: worker
        run: npm test

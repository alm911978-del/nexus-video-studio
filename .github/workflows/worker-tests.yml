name: NEXUS Worker Tests

on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - "index.html"
      - "i18n.js"
      - ".github/workflows/worker-tests.yml"
  pull_request:
    paths:
      - "worker/**"
      - "index.html"
      - "i18n.js"
      - ".github/workflows/worker-tests.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Run gateway and static-site tests
        working-directory: worker
        run: npm test

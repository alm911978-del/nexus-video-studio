name: NEXUS Core Regression Tests

on:
  push:
    branches: ["**"]
    paths:
      - "src/nexus/**"
      - "tests/**"
      - "package.json"
      - ".github/workflows/nexus-core-tests.yml"
  pull_request:
    paths:
      - "src/nexus/**"
      - "tests/**"
      - "package.json"
      - ".github/workflows/nexus-core-tests.yml"

permissions:
  contents: read

jobs:
  nexus-core:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Run NEXUS core regression tests
        run: npm run test:nexus
